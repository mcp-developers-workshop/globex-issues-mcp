# MCP Server identity
quarkus.mcp.server.server-info.name=GlobexIssuesMcpServer
quarkus.mcp.server.server-info.version=1.0.0-SNAPSHOT

# Transport: the quarkus-mcp-server-http extension serves streamable HTTP on /mcp.
# The transport is fixed when the application is built, so it is never read from .env.
quarkus.mcp.server.http.root-path=/mcp

# GitLab REST client base URL. Run time property - override in .env or with an env var.
quarkus.rest-client.gitlab-api.url=https://gitlab-gitlab.apps.itz-2p9ej5.hub04-lb.techzone.ibm.com

# Numeric id of the globex/globex-issues project. Not a secret, so the default lives here.
gitlab.project-id=5

# Placeholder only. The real project access token belongs in .env - never in this file.
gitlab.token=replace-me-with-a-gitlab-project-access-token
